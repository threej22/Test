name: Build Windows x64 portable
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: speakercheck-windows-portable
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Extract application source
        shell: pwsh
        run: Expand-Archive SpeakerCheck-0.4.2-source.zip -DestinationPath app
      - name: Install build dependencies
        run: python -m pip install -r app/requirements-dev.txt pyinstaller==6.16.0
      - name: Obtain SoX portable binaries
        shell: pwsh
        run: |
          choco install sox.portable --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'SoX package installation failed' }
          $soxFile = Get-ChildItem "$env:ChocolateyInstall/lib/sox.portable" -Recurse -Filter sox.exe | Select-Object -First 1
          if (-not $soxFile) { throw 'Actual sox.exe not found in package' }
          "SOX_BINARY=$($soxFile.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run application tests on Windows
        working-directory: app
        run: python -m pytest tests -q
      - name: Build and verify standalone EXE without Python on PATH
        working-directory: app
        shell: pwsh
        run: python scripts/build_portable.py --sox "$env:SOX_BINARY"
      - name: Keep diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            app/output/portable-diagnostic.json
            app/output/portable-windows-gui-diagnostic.json
            app/build/SpeakerCheck/warn-SpeakerCheck.txt
          if-no-files-found: ignore
      - name: Publish verified Windows portable ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.4.2'
          $notes = 'Windows 10/11 x64 portable. Extract the entire ZIP and run SpeakerCheck/SpeakerCheck.exe. Python, pip and SoX installation are not required. Includes runtime dependencies and SoX. Tested on Windows CI with Python removed from PATH; synthetic 1kHz PASS, two-tone FAIL, Qt/PortAudio/SQLite checks. Physical speaker/device verification remains necessary.'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'SpeakerCheck 0.4.2 Windows x64 portable' --notes $notes }
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          gh release upload $tag app/output/SpeakerCheck-0.4.2-windows-x64-portable.zip app/output/SpeakerCheck-0.4.2-windows-x64-portable.zip.sha256 app/output/portable-diagnostic.json app/output/portable-windows-gui-diagnostic.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
